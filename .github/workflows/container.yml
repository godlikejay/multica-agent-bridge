name: Build container image

on:
  push:
    branches: [main]
    # Mirror the runtime Docker build inputs, plus this workflow.
    paths:
      - '.github/workflows/container.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'LICENSE'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - name: Build and smoke-test both platforms
        run: |
          docker buildx create --driver docker-container --name bridge-ci --use
          for arch in amd64 arm64; do
            tag="multica-agent-bridge:smoke-$arch"
            docker buildx build --platform "linux/$arch" --load --tag "$tag" .
            docker run --rm --network none --platform "linux/$arch" "$tag" --profile bridge version
            docker run --rm --network none --platform "linux/$arch" --entrypoint multica-bridge "$tag" acp --version
            docker run --rm --network none --platform "linux/$arch" --entrypoint /bin/sh "$tag" -ec '
              test -s /usr/share/licenses/multica/LICENSE
              test -s /usr/share/licenses/multica/NOTICE
              test -s /usr/share/licenses/multica-agent-bridge/LICENSE
            '
          done
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:latest" --tag "$image:sha-$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/bridge-image.json" .
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/bridge-image.json")
          docker buildx imagetools inspect --raw "$image@$digest" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | unique | . == ["amd64","arm64"]'
          printf 'Published image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
